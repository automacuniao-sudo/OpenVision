name: JARVIS
options:
  bundleIdPrefix: com.jarvis
  # Bumped 16 → 18 for the on-device Gemma 4 (MLX) backend, which needs iOS 18 at runtime.
  # Revert to 16 + gate GemmaLocalService behind `if #available(iOS 18)` to keep older support.
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "2.10.0"
    CURRENT_PROJECT_VERSION: "31"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: JARVIS/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: ${PRODUCT_BUNDLE_IDENTIFIER}
    META_APP_ID: ${META_APP_ID}
    CLIENT_TOKEN: ${CLIENT_TOKEN}
    APP_LINK_URL_SCHEME: ${APP_LINK_URL_SCHEME}

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

targets:
  JARVISTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JARVISTests
    dependencies:
      - target: JARVIS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JARVIS
        excludes:
          - "**/*.example"
    resources:
      - path: JARVIS/Resources
        excludes:
          - "**/*.plist"
    settings:
      base:
        INFOPLIST_FILE: JARVIS/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        CODE_SIGN_ENTITLEMENTS: JARVIS/JARVIS.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: JARVIS/JARVIS-Bridging-Header.h
    dependencies:
      - package: meta-wearables-dat-ios
        products:
          - MWDATCore
          - MWDATCamera
      - package: FluidAudio
        products:
          - FluidAudio
      # On-device Gemma 4 (Local backend). MLX/MLXNN resolve transitively via these products.
      - package: mlx-swift-lm
        products:
          - MLXLLM
          - MLXVLM
          - MLXLMCommon
          - MLXHuggingFace
      - package: swift-huggingface
        products:
          - HuggingFace
      - package: swift-transformers
        products:
          - Tokenizers
      - package: KokoroSwift
        product: KokoroSwift
    preBuildScripts:
      - name: "Check Config Files"
        script: |
          if [ ! -f "${PROJECT_DIR}/Config.xcconfig" ]; then
            echo "error: Config.xcconfig not found. Copy Config.xcconfig.example to Config.xcconfig"
            exit 1
          fi
        basedOnDependencyAnalysis: false

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    # Pinned exactly because the DAT API changes materially between releases.
    # 0.9.0 uses DeviceSession -> addCamera -> Camera.stream and adds newer-device support.
    exactVersion: "0.9.0"
  mlx-swift:
    url: https://github.com/PrismML-Eng/mlx-swift.git
    branch: v0.31.6_prism
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    revision: "68947ccdca79bcf7a26dc220f73caa060369513c"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.15.5"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: "0.1.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: "1.0.0"
  KokoroSwift:
    path: Vendor/kokoro-ios

schemes:
  JARVIS:
    build:
      targets:
        JARVIS: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - JARVISTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
