name: Apply build 23 latency stability fix

on:
  push:
    branches: [build23-latency-stability]
    paths:
      - '.github/workflows/apply-build23-latency-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build23-latency-stability
          fetch-depth: 0
      - name: Apply build 23 patch
        run: python3 scripts/apply_build23_latency_stability.py
      - name: Commit patched code
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Reduce voice latency and recover Gemini Live sessions"
          git push origin HEAD:build23-latency-stability
