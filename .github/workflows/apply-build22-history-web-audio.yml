name: Apply build 22 history web audio fix

on:
  push:
    branches: [build22-history-web-audio]
    paths:
      - '.github/workflows/apply-build22-history-web-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build22-history-web-audio
          fetch-depth: 0
      - name: Apply build 22 patch
        run: python3 scripts/apply_build22_history_web_audio.py
      - name: Commit patched code
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Fix JARVIS audio search history and profile defaults"
          git push origin HEAD:build22-history-web-audio
