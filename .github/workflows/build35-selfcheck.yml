name: Build 35 self-check

on:
  push:
    branches: [jarvis-dev]
    paths:
      - '.github/workflows/build35-selfcheck.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create build config
        run: |
          cp Config.xcconfig.example Config.xcconfig
          cp JARVIS/Config/Config.swift.example JARVIS/Config/Config.swift
          sed -i '' 's/YOUR_TEAM_ID//' Config.xcconfig
          sed -i '' 's/com.yourcompany.jarvis/com.automacuniao.jarvis/' Config.xcconfig
          sed -i '' 's/YOUR_META_APP_ID/0000000000/g' Config.xcconfig

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile and capture result
        id: compile
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee /tmp/jarvis-build35.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            {
              echo 'BUILD 35 SELFCHECK: GREEN'
              echo "commit=$(git rev-parse HEAD)"
              echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > JARVIS_BUILD35_SELFCHECK.txt
          else
            {
              echo 'BUILD 35 SELFCHECK: RED'
              echo "commit=$(git rev-parse HEAD)"
              echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              echo '--- compiler errors ---'
              grep -E '(^|: )(error:|fatal error:)' /tmp/jarvis-build35.log | tail -80 || true
              echo
              echo '--- build tail ---'
              tail -120 /tmp/jarvis-build35.log
            } > JARVIS_BUILD35_SELFCHECK.txt
          fi
          exit 0

      - name: Commit self-check result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JARVIS_BUILD35_SELFCHECK.txt
          git commit -m 'Build 35: record compile self-check' || true
          git push origin HEAD:jarvis-dev

      - name: Fail if compile failed
        if: steps.compile.outputs.status != '0'
        run: exit 1
