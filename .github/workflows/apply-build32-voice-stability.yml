name: Apply Build 32 voice stability patch

on:
  push:
    branches:
      - jarvis-dev
    paths:
      - .github/workflows/apply-build32-voice-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jarvis-dev
        uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          persist-credentials: true

      - name: Apply Build 32 voice stability patch
        run: python .github/patches/build32-voice-stability.py
