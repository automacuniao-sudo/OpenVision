name: Apply build 20 audio fix

on:
  push:
    branches: [build20-audio-fix]
    paths:
      - '.github/workflows/apply-build20-audio-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build20-audio-fix
          fetch-depth: 0
      - name: Apply build 20 patch
        run: python3 scripts/apply_build20_audio_fix.py
      - name: Commit patched code
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Fix wake chime and force phone loudspeaker"
          git push origin HEAD:build20-audio-fix
