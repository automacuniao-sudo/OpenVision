name: Apply Build 31 voice streaming patch

on:
  push:
    branches:
      - jarvis-dev
    paths:
      - .github/workflows/apply-build31-voice-streaming.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jarvis-dev
        uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          persist-credentials: true

      - name: Apply voice streaming and stability patch
        run: python .github/patches/build31-voice-streaming.py
