name: Repair Build 35 compile

on:
  push:
    branches: [jarvis-dev]
    paths:
      - '.github/workflows/repair-build35-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0

      - name: Repair malformed Swift literals and OpenClaw direct invocation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          web = Path('JARVIS/Services/Web/WebSearchService.swift')
          s = web.read_text()

          replacements = [
              ('line += "\nPublicado/atualizado: \\(published)"', 'line += "\\nPublicado/atualizado: \\(published)"'),
              ('line += "\nFonte: \\(sourceURL)"', 'line += "\\nFonte: \\(sourceURL)"'),
              ('parts.joined(separator: "\n")', 'parts.joined(separator: "\\n")'),
          ]

          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          # The broken file contains literal newlines between the Swift quotes.
          broken_published = 'line += "\nPublicado/atualizado: \\(published)"'
          broken_source = 'line += "\nFonte: \\(sourceURL)"'
          broken_join = 'parts.joined(separator: "\n")'
          for old, new in [
              (broken_published, 'line += "\\nPublicado/atualizado: \\(published)"'),
              (broken_source, 'line += "\\nFonte: \\(sourceURL)"'),
              (broken_join, 'parts.joined(separator: "\\n")'),
          ]:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          web.write_text(s)

          oc = Path('JARVIS/Services/OpenClaw/OpenClawService.swift')
          o = oc.read_text()
          direct_anchor = '''            "sessionKey": Self.sessionKey,\n            "idempotencyKey": UUID().uuidString,\n'''
          if direct_anchor in o:
              o = o.replace(direct_anchor, '            "idempotencyKey": UUID().uuidString,\n', 1)
              changed = True
          oc.write_text(o)

          if not changed:
              print('No source changes were needed')
          else:
              print('Build 35 source repair applied')
          PY

      - name: Verify malformed literals are gone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('JARVIS/Services/Web/WebSearchService.swift').read_text()
          bad = [
              'line += "\nPublicado/atualizado:',
              'line += "\nFonte:',
              'parts.joined(separator: "\n")',
          ]
          # At this point those Python strings represent literal newlines; if present,
          # Swift still has a line break inside a normal quoted string.
          remaining = [x for x in bad if x in s]
          if remaining:
              raise SystemExit(f'Malformed Swift string literals remain: {remaining}')
          print('Swift string literal repair verified')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JARVIS/Services/Web/WebSearchService.swift JARVIS/Services/OpenClaw/OpenClawService.swift
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build 35: repair Swift search literals and OpenClaw direct call'
            git push origin HEAD:jarvis-dev
          fi
