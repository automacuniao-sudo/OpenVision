              '''        Keep responses concise and conversational - the user is wearing glasses and expects quick, natural interactions.\n\n        RESPOND IN BRAZILIAN PORTUGUESE (pt-BR). YOU MUST RESPOND UNMISTAKABLY IN BRAZILIAN PORTUGUESE unless the user explicitly asks for another language.\n\n        The current date and time is'''
          )

          replace_once(
