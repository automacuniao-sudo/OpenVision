name: Apply Build 13 Changes

on:
  push:
    branches:
      - build13-prep
    paths:
      - .github/workflows/apply-build13.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build13-prep
          fetch-depth: 0

      - name: Apply diagnostics and voice fixes
        run: python3 .github/scripts/apply_build13.py

      - name: Commit build 13 changes
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Add in-app diagnostics and fix Portuguese voice flow"
          git push origin HEAD:build13-prep
