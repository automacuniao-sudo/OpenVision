              '''                    isModelSpeaking = true\n                    isProcessing = true\n                    DiagnosticLogger.shared.log("GeminiAudio", "Received PCM chunk bytes=\\(audioData.count)")\n\n                    if let onAudioReceived {'''
          )
          replace_once(
              "OpenVision/Services/GeminiLive/GeminiLiveService.swift",
              '''        if let outputTranscription = content["outputTranscription"] as? [String: Any],\n           let text = outputTranscription["text"] as? String, !text.isEmpty {\n            onOutputTranscription?(text)''',
              '''        if let outputTranscription = content["outputTranscription"] as? [String: Any],\n           let text = outputTranscription["text"] as? String, !text.isEmpty {\n            DiagnosticLogger.shared.log("Gemini", "Output transcript: \\(text)")\n            onOutputTranscription?(text)'''
          )

          # 6) Playback diagnostics.
          replace_once(
              "OpenVision/Services/Audio/AudioPlaybackService.swift",
              '        print("[AudioPlayback] Engine started")',
              '        print("[AudioPlayback] Engine started")\n        DiagnosticLogger.shared.log("Audio", "Playback engine started format=\\(outputFormat.sampleRate)Hz/\\(outputFormat.channelCount)ch")'
          )
          replace_once(
              "OpenVision/Services/Audio/AudioPlaybackService.swift",
