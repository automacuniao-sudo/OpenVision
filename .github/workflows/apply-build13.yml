              '        print("[VoiceCommand] 🎤 heard(\\(state)): \\"\\(transcription)\\"")\n        DiagnosticLogger.shared.log("STT", "heard[\\(state)]: \\(transcription)")'
          )
          replace_once(
              "OpenVision/Services/Voice/VoiceCommandService.swift",
              '        print("[VoiceCommand] Wake word detected!")',
