name: Apply build 17 echo fix

on:
  push:
    branches: [build17-echo-fix]
    paths:
      - '.github/workflows/apply-build17-echo-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build17-echo-fix
          fetch-depth: 0
      - name: Apply build 17 patch
        run: python3 scripts/apply_build17.py
      - name: Commit patched code
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Fix acoustic echo and stabilize JARVIS barge-in"
          git push origin HEAD:build17-echo-fix
