name: Apply build 18 voice and web patch

on:
  push:
    branches: [jarvis-dev]
    paths:
      - '.github/workflows/apply-build18.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0
      - name: Apply build 18 patch
        run: python3 scripts/apply_build18.py
      - name: Commit final build 18 code
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Improve background voice routing and enable web search"
          git push origin HEAD:jarvis-dev
