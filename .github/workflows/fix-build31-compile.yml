name: Fix Build 31 compile error

on:
  push:
    branches:
      - jarvis-dev
    paths:
      - '.github/workflows/fix-build31-compile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0

      - name: Patch VoiceCommandService
        shell: bash
        run: echo '' | base64 --decode | python3

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JARVIS/Services/Voice/VoiceCommandService.swift
          git diff --cached --quiet && exit 1 || true
          git commit -m "Fix Build 31 MainActor compile error"
          git push origin HEAD:jarvis-dev
