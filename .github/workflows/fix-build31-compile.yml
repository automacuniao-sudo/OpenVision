name: Fix Build 31 compile error

on:
  push:
    branches: [jarvis-dev]
    paths:
      - .github/workflows/fix-build31-compile.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0

      - name: Patch MainActor diagnostic call
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('JARVIS/Services/Voice/VoiceCommandService.swift')
          text = path.read_text()
          old = '''        if let reason = OVCatchException({
            request.append(buffer)
        }) {
            DiagnosticLogger.shared.log("Voice", "Speech append exception suppressed: \\(reason)")
        }
'''
          new = '''        if let reason = OVCatchException({
            request.append(buffer)
        }) {
            Task { @MainActor in
                DiagnosticLogger.shared.log("Voice", "Speech append exception suppressed: \\(reason)")
            }
        }
'''
          if old not in text:
              raise SystemExit('Expected appendSafely block not found; refusing blind patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JARVIS/Services/Voice/VoiceCommandService.swift
          git commit -m "Fix Build 31 MainActor compile error"
          git push origin HEAD:jarvis-dev
