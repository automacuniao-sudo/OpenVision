name: Apply OpenClaw Build 30 patch

on:
  push:
    branches:
      - jarvis-dev
    paths:
      - .github/workflows/apply-openclaw-build30.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jarvis-dev
        uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          persist-credentials: true

      - name: Apply OpenClaw stabilization patch
        run: python .github/patches/openclaw-build30.py
