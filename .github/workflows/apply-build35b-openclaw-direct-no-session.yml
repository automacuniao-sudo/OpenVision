name: Apply Build 35b OpenClaw direct hardening

on:
  push:
    branches: [jarvis-dev]
    paths:
      - '.github/patches/build35b-openclaw-direct-no-session.py'
      - '.github/workflows/apply-build35b-openclaw-direct-no-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0
      - name: Apply hardening
        run: python3 .github/patches/build35b-openclaw-direct-no-session.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JARVIS/Services/OpenClaw/OpenClawService.swift
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Build 35: harden direct OpenClaw tool invocation'
            git push origin HEAD:jarvis-dev
          fi
