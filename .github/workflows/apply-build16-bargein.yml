name: Apply build 16 barge-in hotfix

on:
  push:
    branches:
      - build16-bargein
    paths:
      - '.github/scripts/apply_build16_bargein.py'
      - '.github/workflows/apply-build16-bargein.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build16-bargein
          fetch-depth: 0
      - name: Apply hotfix
        run: python3 .github/scripts/apply_build16_bargein.py
      - name: Remove one-shot patch files
        run: |
          rm .github/scripts/apply_build16_bargein.py
          rm .github/workflows/apply-build16-bargein.yml
      - name: Commit result
        run: |
          git config user.name "automacuniao-sudo"
          git config user.email "317072769+automacuniao-sudo@users.noreply.github.com"
          git add -A
          git commit -m "Fix JARVIS interruption over speaker echo"
          git push origin build16-bargein
