name: Apply Build 33 conversation runtime v2

on:
  push:
    branches:
      - jarvis-dev
    paths:
      - .github/workflows/apply-build33-conversation-runtime-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jarvis-dev
        uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          persist-credentials: true

      - name: Apply Build 33 conversation runtime v2
        run: python .github/patches/build33-conversation-runtime-v2.py
