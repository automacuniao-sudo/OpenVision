name: Capture official Build 35 status

on:
  workflow_run:
    workflows: ["Build JARVIS iOS"]
    types: [completed]
    branches: [jarvis-dev]

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.workflow_run.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis-dev
          fetch-depth: 0

      - name: Capture run status and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          {
            echo "BUILD JARVIS IOS OFFICIAL: ${CONCLUSION^^}"
            echo "run_number=$RUN_NUMBER"
            echo "run_id=$RUN_ID"
            echo "head_sha=$HEAD_SHA"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- artifacts ---"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[]? | "name=\(.name) id=\(.id) size=\(.size_in_bytes) expired=\(.expired)"' || true
          } > JARVIS_BUILD35_OFFICIAL_STATUS.txt

          if [ "$CONCLUSION" != "success" ]; then
            {
              echo
              echo "--- failed log excerpts ---"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
                | grep -E 'error:|fatal error:|BUILD FAILED|Process completed with exit code' \
                | tail -100 || true
            } >> JARVIS_BUILD35_OFFICIAL_STATUS.txt
          fi

      - name: Commit captured status
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JARVIS_BUILD35_OFFICIAL_STATUS.txt
          git commit -m 'CI status: capture official Build 35 [skip ci]' || true
          git push origin HEAD:jarvis-dev
