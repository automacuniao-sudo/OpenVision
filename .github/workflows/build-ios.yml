name: Build JARVIS iOS

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-dev
  pull_request:
    branches:
      - jarvis-dev

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Mostrar ambiente
        run: |
          sw_vers
          xcodebuild -version

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Criar arquivos de configuracao
        run: |
          cp Config.xcconfig.example Config.xcconfig
          cp JARVIS/Config/Config.swift.example JARVIS/Config/Config.swift

          sed -i '' 's/YOUR_TEAM_ID//' Config.xcconfig
          sed -i '' 's/com.yourcompany.jarvis/com.automacuniao.jarvis/' Config.xcconfig
          sed -i '' 's/YOUR_META_APP_ID/0000000000/g' Config.xcconfig

      - name: Instalar Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Gerar projeto Xcode
        run: |
          xcodegen generate

      - name: Rodar testes (JARVISTests)
        run: |
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            test

      - name: Compilar sem assinatura
        run: |
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Criar IPA
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/JARVIS.app build/ipa/Payload/

          cd build/ipa
          zip -r JARVIS-unsigned.ipa Payload

      - name: Salvar IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-iOS-unsigned
          path: build/ipa/JARVIS-unsigned.ipa
