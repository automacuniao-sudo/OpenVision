name: Build JARVIS iOS

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-dev

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Mostrar ambiente
        run: |
          sw_vers
          xcodebuild -version

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Criar arquivos de configuracao
        run: |
          cp Config.xcconfig.example Config.xcconfig
          cp JARVIS/Config/Config.swift.example JARVIS/Config/Config.swift

          sed -i '' 's/YOUR_TEAM_ID//' Config.xcconfig
          sed -i '' 's/com.yourcompany.jarvis/com.automacuniao.jarvis/' Config.xcconfig
          sed -i '' 's/YOUR_META_APP_ID/0000000000/g' Config.xcconfig

      - name: Instalar Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Gerar projeto Xcode
        run: |
          xcodegen generate

      - name: Compilar sem assinatura
        run: |
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Criar IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/JARVIS.app build/ipa/Payload/

          cd build/ipa
          zip -r JARVIS-unsigned.ipa Payload

      - name: Salvar IPA
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-iOS-unsigned
          path: build/ipa/JARVIS-unsigned.ipa

      - name: Registrar resultado oficial GREEN
        if: success()
        shell: bash
        run: |
          {
            echo 'BUILD JARVIS IOS OFFICIAL: GREEN'
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'artifact=JARVIS-iOS-unsigned'
          } > JARVIS_BUILD35_OFFICIAL_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JARVIS_BUILD35_OFFICIAL_STATUS.txt
          git commit -m 'CI status: official Build 35 GREEN [skip ci]' || true
          git push origin HEAD:jarvis-dev

      - name: Registrar resultado oficial RED
        if: failure()
        shell: bash
        run: |
          {
            echo 'BUILD JARVIS IOS OFFICIAL: RED'
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > JARVIS_BUILD35_OFFICIAL_STATUS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add JARVIS_BUILD35_OFFICIAL_STATUS.txt
          git commit -m 'CI status: official Build 35 RED [skip ci]' || true
          git push origin HEAD:jarvis-dev
