name: Build JARVIS iOS

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-dev
  pull_request:
    branches:
      - jarvis-dev

# A PR synchronize event is emitted for every pushed fix. Keep only the newest commit running so
# old Build 40 attempts do not keep consuming Intel runners and compiling MLX after they are obsolete.
concurrency:
  group: jarvis-ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 Arm64 provisioning timed out repeatedly on this PR. Use the separate
    # Intel pool while keeping Xcode 26.6 / Swift 6.3 required by current mlx-swift.
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Mostrar ambiente
        run: |
          sw_vers
          xcodebuild -version

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Criar arquivos de configuracao
        run: |
          cp Config.xcconfig.example Config.xcconfig
          cp JARVIS/Config/Config.swift.example JARVIS/Config/Config.swift

          sed -i '' 's/YOUR_TEAM_ID//' Config.xcconfig
          sed -i '' 's/com.yourcompany.jarvis/com.automacuniao.jarvis/' Config.xcconfig
          sed -i '' 's/YOUR_META_APP_ID/0000000000/g' Config.xcconfig

      - name: Instalar Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Gerar projeto Xcode
        run: |
          xcodegen generate

      - name: Resolver pacotes Swift de forma isolada
        run: |
          set -euo pipefail
          mkdir -p build

          # GitHub's prewarmed global SwiftPM repository cache can occasionally contain a
          # half-removed clone (observed as exit 74 for mlx-swift). Keep this workflow independent
          # from that cache and retry package resolution on the runner-local SourcePackages path.
          for attempt in 1 2 3; do
            echo "Package resolution attempt $attempt/3"
            rm -rf "$HOME/Library/Caches/org.swift.swiftpm/repositories"
            if xcodebuild               -resolvePackageDependencies               -project JARVIS.xcodeproj               -scheme JARVIS               -clonedSourcePackagesDirPath build/SourcePackages               -disablePackageRepositoryCache; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Package resolution failed after 3 attempts"
              exit 74
            fi

            rm -rf build/SourcePackages
            sleep $((attempt * 5))
          done

      - name: Executar testes portateis no simulador
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, device["name"], device["udid"])
              for runtime, runtime_devices in devices.items()
              if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS")
              for device in runtime_devices
              if device.get("isAvailable")
          ]
          if not candidates:
              raise SystemExit("No available iOS Simulator found")
          print(sorted(candidates)[0][2])
          ' )"
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVISPureTests \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disablePackageRepositoryCache \
            test

      - name: Compilar app e bundle completo de testes para dispositivo (sem executar)
        # O bundle completo ainda depende de MLX/Metal e do SDK da camera dos oculos.
        # build-for-testing ja compila o app e o target de testes. Mantemos tudo no mesmo
        # DerivedData e reutilizamos o JARVIS.app resultante para criar a IPA. Isso evita
        # uma segunda compilacao completa das dependencias pesadas (MLX, xgrammar, FluidAudio),
        # sem executar no simulador o bundle que depende de hardware.
        run: |
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disablePackageRepositoryCache \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build-for-testing

      - name: Verificar produto compilado
        if: github.event_name != 'pull_request'
        run: |
          test -d build/DerivedData/Build/Products/Debug-iphoneos/JARVIS.app
          echo "JARVIS.app pronto para empacotamento"

      - name: Criar IPA
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/JARVIS.app build/ipa/Payload/

          cd build/ipa
          zip -r JARVIS-unsigned.ipa Payload

      - name: Salvar IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: JARVIS-iOS-unsigned
          path: build/ipa/JARVIS-unsigned.ipa
